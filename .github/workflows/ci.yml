name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: index.txt 与重生成结果一致
        run: python tools/build-index.py --check
      - name: 深度校验（sha256 / 容器结构 / 自洽性 / 名字一致性）
        run: python tools/validate.py
